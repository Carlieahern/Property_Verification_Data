<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecting | Property Detail Verification</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#f4f6f9;color:#1f2430;
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .card{background:#fff;border:1px solid #dfe4ec;border-radius:10px;padding:26px 28px;
    max-width:440px;margin:16px;text-align:center}
  h1{font-size:17px;margin:0 0 8px}
  p{margin:0 0 16px;color:#5b6577;font-size:14px}
  a{display:inline-block;background:#1a6dbf;color:#fff;text-decoration:none;
    padding:10px 18px;border-radius:8px;font-weight:600}
</style>
<div class="card">
  <h1>Taking you to your property list…</h1>
  <p>That link picked up some extra characters on the way — usually an email client
     running it together with the next word. Sending you to the right place.</p>
  <p><a href="/" id="go">Open the property list</a></p>
</div>
<script>
  // Keep any ?rm= that survived, so a mangled link still lands on the right portfolio.
  var qs = window.location.search || '';
  document.getElementById('go').setAttribute('href', '/' + qs);
  window.location.replace('/' + qs);
</script>
