<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Property Detail Verification | RPM</title>
<style>
  :root{
    --navy:#0f2f4f; --navy-2:#164a78; --blue:#1a6dbf; --blue-soft:#e8f1fa;
    --ink:#1f2430; --muted:#5b6577; --line:#dfe4ec; --bg:#f4f6f9; --card:#fff;
    --green:#127a51; --green-soft:#e4f5ee; --amber:#8a5a00; --amber-soft:#fdf3e0;
    --red:#b3261e; --red-soft:#fdecea; --radius:10px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .wrap{max-width:900px;margin:0 auto;padding:0 16px 90px}

  header{background:var(--navy);color:#fff;padding:18px 0;margin-bottom:22px}
  header .wrap{padding-bottom:0;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
  h1{font-size:18px;margin:0;font-weight:600;letter-spacing:.2px}
  .sub{font-size:13px;opacity:.75;margin-top:2px}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px;margin-bottom:18px}
  .panel h2{font-size:15px;margin:0 0 4px;font-weight:600}
  .panel p.hint{margin:0 0 14px;color:var(--muted);font-size:13.5px}

  label.fl{display:block;font-weight:600;font-size:13.5px;margin-bottom:5px}
  select,input[type=text],input[type=tel],input[type=time],textarea{
    width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;
    font:inherit;color:var(--ink);background:#fff}
  select:focus,input:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue)}
  textarea{min-height:70px;resize:vertical}
  select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 14 14'><path d='M3 5l4 4 4-4' fill='none' stroke='%235b6577' stroke-width='1.8' stroke-linecap='round'/></svg>");
    background-repeat:no-repeat;background-position:right 11px center;padding-right:34px}

  .btn{display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;border-radius:8px;
    padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;background:var(--blue);color:#fff}
  .btn:hover{background:var(--navy-2)}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--ink)}
  .btn.ghost:hover:not([disabled]){background:#f2f5f9}
  .btn.ok{background:var(--green)} .btn.ok:hover:not([disabled]){background:#0e5f3f}
  .btn.sm{padding:6px 12px;font-size:13px}
  .btn.tiny{padding:5px 11px;font-size:12.5px;font-weight:600}
  .linkbtn{background:none;border:0;color:var(--blue);font:inherit;font-size:12.5px;
    cursor:pointer;padding:0;text-decoration:underline}

  .progress{height:9px;background:#e6eaf0;border-radius:99px;overflow:hidden;margin:10px 0 6px}
  .progress > span{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .35s ease}
  .prog-label{font-size:13.5px;color:var(--muted)}

  .pill{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;
    letter-spacing:.3px;text-transform:uppercase;white-space:nowrap}
  .pill{border:1.5px solid transparent}
  .pill.verified{background:var(--green);color:#fff;border-color:var(--green)}
  .pill.ready{background:var(--blue-soft);color:var(--navy-2);border-color:#8fc0e8}
  .pill.in_progress{background:var(--amber-soft);color:var(--amber);border-color:#dda93f}
  .pill.needs_input{background:var(--red-soft);color:var(--red);border-color:#e0938c}

  .wavehead{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;
    margin:26px 0 10px;padding-bottom:8px;border-bottom:2px solid var(--line)}
  .wavehead h3{margin:0;font-size:15px;font-weight:700}
  .wavehead .dates{font-size:13px;color:var(--muted)}
  .wavehead .dates b{color:var(--ink)}

  .prop{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);
    margin-bottom:12px;overflow:hidden;border-left-width:6px;border-left-color:#c8d0dc}
  .prop.st-verified{border-color:#9ed4bd;border-left-color:var(--green);background:#fbfefc}
  .prop.st-ready{border-color:#a9cdec;border-left-color:var(--blue)}
  .prop.st-in_progress{border-color:#e8cf9a;border-left-color:#d79a2b}
  .prop.st-needs_input{border-color:#e6b3ad;border-left-color:var(--red)}
  .prop.done{border-color:#9ed4bd}
  .prop-head{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;background:none;border:0;
    width:100%;text-align:left;font:inherit;color:inherit}
  .prop-head:hover{background:#f7f9fc}
  .prop-title{flex:1;min-width:0}
  .prop-title strong{display:block;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .prop-title span{font-size:12.5px;color:var(--muted)}
  .chev{color:var(--muted);transition:transform .2s;flex-shrink:0}
  .prop.open .chev{transform:rotate(90deg)}
  .prop-body{border-top:1px solid var(--line);padding:16px;display:none}
  .prop.open .prop-body{display:block}

  .banner{border-radius:8px;padding:11px 13px;font-size:13.5px;margin-bottom:14px}
  .banner.warn{background:var(--amber-soft);color:var(--amber);border:1px solid #f0dcb4}
  .banner.good{background:var(--green-soft);color:var(--green);border:1px solid #bfe4d4}
  .banner.err{background:var(--red-soft);color:var(--red);border:1px solid #f3c9c5}
  .banner.lock{background:#eef1f6;color:#3c4759;border:1px solid var(--line)}
  .banner.info{background:var(--blue-soft);color:var(--navy-2);border:1px solid #c9dff2}

  /* reference facts */
  .facts{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:16px}
  .fact{display:grid;grid-template-columns:minmax(0,200px) 1fr;gap:12px;padding:8px 12px;
    border-bottom:1px solid var(--line);font-size:13.5px;background:#fafbfd}
  .fact:last-child{border-bottom:0}
  .fact dt{color:var(--muted);font-weight:600}
  .fact dd{margin:0;overflow-wrap:anywhere}

  /* one verifiable line */
  .vrow{border:1.5px solid var(--line);border-radius:8px;padding:12px 13px;margin-bottom:10px;
    background:#fff;border-left-width:5px;border-left-color:#c8d0dc}
  .vrow.settled{border-color:#9ed4bd;border-left-color:var(--green);background:#f4fbf8}
  .vrow.todo{border-color:#e8cf9a;border-left-color:#d79a2b;background:#fffcf3}
  .vrow.blank{border-color:#e6b3ad;border-left-color:var(--red);background:#fff7f6}
  .vlabel .tick{color:var(--green);background:var(--green-soft);border:1px solid #9ed4bd;
    border-radius:99px;padding:2px 8px}
  .vrow.completedby{border-style:dashed}
  .vlabel{font-weight:600;font-size:13.5px;margin-bottom:7px;display:flex;gap:9px;
    align-items:baseline;justify-content:space-between}
  .vlabel .tick{font-size:12px;font-weight:700;color:var(--green);white-space:nowrap}
  /* still behind the passcode; deliberately quiet so reviewers ignore it */
  .adminlink{color:rgba(255,255,255,.72);font-size:12.5px;text-decoration:none;
    border:1px solid rgba(255,255,255,.28);border-radius:6px;padding:4px 11px;white-space:nowrap}
  .adminlink:hover{background:rgba(255,255,255,.12);color:#fff}

  /* nothing on file for this line */
  .vlabel .req{color:var(--red);font-weight:800;font-size:15px;cursor:help}
  .vhint{font-size:13px;color:var(--muted);margin:-3px 0 9px;line-height:1.5}

  /* reference details and the people attached to the property */
  .refactions{display:flex;gap:8px;margin:-6px 0 16px}
  .staffin{width:100%;padding:6px 9px;border:1px solid var(--line);border-radius:6px;
    font:inherit;font-size:14px;background:#fff}
  .lockmark{font-size:12px;color:var(--muted)}
  .blankstaff{color:#9aa5b5;font-style:italic;font-size:13px;
    border-bottom:1px dashed #c8d0dc;padding-bottom:1px}

  /* stacked option list, for choices too long for one strip */
  .optlist{display:flex;flex-direction:column;gap:7px;max-width:460px}
  .optlist button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;
    background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:9px 13px;
    font:inherit;font-weight:600;cursor:pointer;color:var(--ink);text-align:left;width:100%}
  .optlist button:hover:not([aria-pressed=true]){background:#f2f5f9}
  .optlist button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
  .optlist .optnote{font-size:12px;font-weight:500;opacity:.8}

  /* confirm-what-we-hold lines */
  .openlink{display:inline-block;font-size:15.5px;font-weight:600;color:var(--blue);
    word-break:break-all;margin-bottom:6px}
  .note.ok{color:var(--green);font-weight:600}
  .confirmq{font-size:14px;font-weight:600;margin:10px 0 7px}

  /* office hours greyed out when the office is appointment only */
  .hours.appt .hrow,.hours.appt > .seg.sm{opacity:.4;pointer-events:none}

  .signdate{margin-top:12px;max-width:220px}
  .signdate input{background:#f2f5f9;color:var(--muted);cursor:not-allowed}

  .na-note{background:#f2f5f9;border:1px solid var(--line);border-left:4px solid #8fa3bd;
    border-radius:7px;padding:10px 12px;margin:0 0 12px;font-size:13px;color:var(--muted)}
  .vnotice{background:var(--amber-soft);border:1px solid #f0dcb4;border-left:4px solid #d79a2b;
    border-radius:7px;padding:11px 13px;margin:0 0 11px;font-size:13.5px;line-height:1.55;
    color:#6b4708;font-weight:500}
  /* the answer is the thing being checked, so it outweighs its own label */
  .vvalue{font-size:16.5px;font-weight:600;line-height:1.45;color:var(--ink);
    white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:11px;
    background:#f7f9fc;border:1px solid #e4e9f0;border-radius:7px;padding:9px 12px}
  .hourslist{margin-bottom:11px;border:1px solid #e4e9f0;border-radius:7px;overflow:hidden;background:#f7f9fc}
  .hline{display:flex;gap:14px;align-items:baseline;padding:7px 12px;border-bottom:1px solid #e8edf4}
  .hline:last-child{border-bottom:0}
  .hline .hd{flex:0 0 82px;font-weight:700;font-size:13px;color:var(--muted);
    text-transform:uppercase;letter-spacing:.4px}
  .hline .ht{font-size:16px;font-weight:600;color:var(--ink)}
  .fact dd .vvalue,.fact dd .hourslist{margin-bottom:0;background:none;border:0;padding:0;font-size:14px}
  .fact dd .hline{padding:2px 0;border-bottom:0}
  .fact dd .hline .hd{flex:0 0 70px;font-size:12px}
  .fact dd .hline .ht{font-size:14px;font-weight:600}
  .vvalue.none{color:var(--red);font-weight:600;font-size:13.5px}
  .vactions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .note{font-size:12.5px;color:var(--muted);margin-top:6px}

  .toggle{display:inline-flex;align-items:center;gap:9px;background:#fff;border:1.5px solid var(--line);
    border-radius:8px;padding:9px 15px 9px 11px;font:inherit;font-weight:600;font-size:14px;
    color:var(--ink);cursor:pointer}
  .toggle:hover{background:#f2f5f9}
  .toggle .box{width:19px;height:19px;border:1.5px solid #b6c0cf;border-radius:5px;background:#fff;
    display:inline-flex;align-items:center;justify-content:center;font-size:13px;line-height:1;color:#fff}
  .toggle.on{background:var(--green-soft);border-color:var(--green);color:var(--green)}
  .toggle.on .box{background:var(--green);border-color:var(--green)}
  /* wraps rather than overflowing when a choice has three options, or a long one */
  .seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden;max-width:100%}
  .seg button{background:#fff;border:0;padding:9px 20px;font:inherit;font-weight:600;cursor:pointer;
    color:var(--muted);flex:0 1 auto}
  .seg button + button{border-left:1px solid var(--line)}
  @media(max-width:520px){ .seg{width:100%} .seg button{flex:1 1 100%;border-left:0}
    .seg button + button{border-top:1px solid var(--line)} }
  .seg button[aria-pressed=true]{background:var(--blue);color:#fff}
  .seg button:hover:not([aria-pressed=true]){background:#f2f5f9}
  .seg.sm button{padding:6px 13px;font-size:13px}

  /* office hours */
  .hours{border:1px solid var(--line);border-radius:8px;padding:12px;background:#fcfdfe}
  .hrow{display:grid;grid-template-columns:126px auto 1fr;gap:10px;align-items:center;
    padding:7px 0;border-top:1px solid var(--line)}
  .hrow:first-of-type{border-top:0}
  .hrow .hday{font-weight:600;font-size:13.5px}
  .hrow .times{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .hrow .times input[type=time]{width:128px;padding:7px 9px}
  .hrow .times select.timesel{width:132px;padding:7px 9px}
  .hrow.closed .times{opacity:.4}
  .hours-preview{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
  .hours-preview b{color:var(--ink);font-weight:600}
  @media(max-width:620px){
    .hrow{grid-template-columns:1fr;gap:6px}
    .fact{grid-template-columns:1fr;gap:2px}
  }

  .checkline{font-size:13.5px;color:var(--muted);margin:14px 0 10px;font-weight:600}
  .actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .meta{font-size:12.5px;color:var(--muted);margin-top:12px}
  .backlink{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1.5px solid var(--line);
    border-radius:8px;padding:9px 14px;margin-bottom:12px;font:inherit;font-weight:600;font-size:14px;
    color:var(--navy-2);cursor:pointer}
  .backlink:hover{background:#eef3f9;border-color:#a9cdec}
  .backlink span{font-size:16px;line-height:1}
  .share-note{margin-top:16px;font-size:13px;color:var(--muted);font-weight:600}
  .share{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
  .share input{font-size:13px;background:#f7f9fc}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:var(--ink);color:#fff;
    padding:11px 18px;border-radius:8px;font-size:14px;box-shadow:0 6px 22px rgba(0,0,0,.2);z-index:80}
  .center{text-align:center;color:var(--muted);padding:36px 10px}
  .hidden{display:none !important}

  .overlay{position:fixed;inset:0;background:rgba(16,24,38,.55);display:flex;align-items:center;
    justify-content:center;padding:20px;z-index:70}
  .modal{background:#fff;border-radius:12px;max-width:470px;width:100%;padding:24px;
    box-shadow:0 18px 50px rgba(0,0,0,.25)}
  .modal h3{margin:0 0 10px;font-size:17px}
  .modal p{margin:0 0 8px;color:#3c4759;font-size:14.5px}
  .modal .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div>
      <h1>Property Detail Verification</h1>
      <div class="sub" id="waveSub">Loading…</div>
    </div>
    <a class="adminlink" href="/admin">Admin</a>
  </div>
</header>

<div class="wrap">
  <div id="fatal" class="banner err hidden"></div>

  <div class="panel" id="pickPanel">
    <h2>Find your portfolio</h2>
    <p class="hint" id="pickHint">Choose your Regional Manager to see the properties that need checking.</p>
    <div class="row">
      <label class="fl" for="rmSel">Regional Manager</label>
      <select id="rmSel"><option value="">Select a name…</option></select>
    </div>
  </div>

  <div id="portfolio" class="hidden">
    <button type="button" class="backlink" id="backBtn">
      <span aria-hidden="true">←</span> Not you? Pick a different name
    </button>
    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
        <div>
          <h2 id="rmTitle"></h2>
          <p class="hint" id="rmSubtitle" style="margin-bottom:0"></p>
        </div>
      </div>
      <div class="progress"><span id="progBar" style="width:0%"></span></div>
      <div class="prog-label" id="progLabel"></div>
      <div id="doneBanner" class="banner good hidden" style="margin-top:14px"></div>
      <div class="share-note">Copy this link to send to any RPM employee assisting you with verification.</div>
      <div class="share">
        <input type="text" id="shareUrl" readonly>
        <button class="btn ghost sm" id="copyBtn">Copy link</button>
      </div>
    </div>
    <div id="propList"></div>
  </div>
</div>

<script>
(function(){
"use strict";

var FIELDS = [], BY_KEY = {};
var state = { scope:'open', waveId:null, waves:[], rmSlug:null, regional:null, props:[], person:'' };
var drafts = {};   // propertyId -> working values
var rows   = {};   // propertyId -> { fieldKey: 'idle' | 'confirmed' | 'editing' }
var staffEdit = {};  // propertyId -> details panel open for editing

var DAY_KEYS  = ['mon','tue','wed','thu','fri','sat','sun'];
var DAY_LABEL = { mon:'Monday', tue:'Tuesday', wed:'Wednesday', thu:'Thursday', fri:'Friday', sat:'Saturday', sun:'Sunday' };
var DAY_SHORT = { mon:'Mon', tue:'Tue', wed:'Wed', thu:'Thu', fri:'Fri', sat:'Sat', sun:'Sun' };

var $ = function(s){ return document.querySelector(s); };
function el(tag, attrs, kids){
  var n = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function(k){
    if (k === 'class') n.className = attrs[k];
    else if (k === 'text') n.textContent = attrs[k];
    else if (k === 'html') n.innerHTML = attrs[k];
    else if (k.slice(0,2) === 'on') n.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, attrs[k]);
  });
  (kids || []).forEach(function(c){ if (c) n.appendChild(c); });
  return n;
}
function toast(msg){
  var t = el('div', { class:'toast', text: msg });
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2800);
}
function api(path, opts){
  return fetch(path, opts).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(b){
      if (!r.ok) { var e = new Error(b.error || ('Request failed (' + r.status + ')')); e.body = b; throw e; }
      return b;
    });
  });
}
function fmtDate(v){
  if (!v) return '';
  var s = String(v).trim();
  var m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  var d = m ? new Date(+m[1], +m[2]-1, +m[3]) : new Date(s);
  if (isNaN(d.getTime())) return s;
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
}
function modal(opts){
  return new Promise(function(resolve){
    var overlay = el('div', { class:'overlay' });
    var box = el('div', { class:'modal', role:'dialog', 'aria-modal':'true' });
    box.appendChild(el('h3', { text: opts.title }));
    (opts.lines || []).forEach(function(l){ box.appendChild(el('p', { text: l })); });
    var acts = el('div', { class:'modal-actions' });
    function close(v){ document.removeEventListener('keydown', onKey); overlay.remove(); resolve(v); }
    (opts.buttons || []).forEach(function(b){
      acts.appendChild(el('button', { class:'btn ' + (b.style || 'ghost'), type:'button', text:b.label,
        onclick: function(){ close(b.value); } }));
    });
    box.appendChild(acts);
    overlay.appendChild(box);
    overlay.addEventListener('click', function(e){ if (e.target === overlay) close(false); });
    function onKey(e){ if (e.key === 'Escape') close(false); }
    document.addEventListener('keydown', onKey);
    document.body.appendChild(overlay);
    var f = acts.querySelector('.btn'); if (f) f.focus();
  });
}

// ---------- office hours ----------
function parseHours(v){
  if (!v) return null;
  if (typeof v === 'object') return v;
  try { return JSON.parse(v); } catch(e){ return null; }
}
function blankDay(){ return { closed:false, open:'', close:'' }; }
function expandHours(s){
  if (!s) return null;
  var out = {};
  if (s.mode === 'daily') {
    DAY_KEYS.forEach(function(d){ out[d] = Object.assign(blankDay(), (s.days||{})[d] || {}); });
  } else {
    var wd = Object.assign(blankDay(), s.weekdays || {});
    ['mon','tue','wed','thu','fri'].forEach(function(d){ out[d] = Object.assign({}, wd); });
    out.sat = Object.assign(blankDay(), s.saturday || {});
    out.sun = Object.assign(blankDay(), s.sunday || {});
  }
  return out;
}
function hoursComplete(s){
  // An appointment-only office has no hours to state, so that alone completes it.
  if (s && s.appointmentOnly) return true;
  var days = expandHours(s);
  if (!days) return false;
  var anyOpen = false;
  for (var i=0;i<DAY_KEYS.length;i++){
    var v = days[DAY_KEYS[i]];
    if (!v) return false;
    if (v.closed) continue;
    if (!v.open || !v.close) return false;
    anyOpen = true;
  }
  return anyOpen;
}
function to12h(h){
  var m = String(h||'').match(/^(\d{1,2}):(\d{2})$/);
  if (!m) return String(h||'');
  var hh = parseInt(m[1],10), suf = hh >= 12 ? 'PM' : 'AM';
  hh = hh % 12; if (hh === 0) hh = 12;
  return hh + ':' + m[2] + ' ' + suf;
}
function formatHours(s){
  if (s && s.appointmentOnly) return 'By appointment only';
  var days = expandHours(s);
  if (!days) return '';
  var sig = function(d){ return days[d].closed ? 'closed' : (days[d].open + '|' + days[d].close); };
  var parts = [], i = 0;
  while (i < DAY_KEYS.length){
    var j = i;
    while (j+1 < DAY_KEYS.length && sig(DAY_KEYS[j+1]) === sig(DAY_KEYS[i])) j++;
    var span = i === j ? DAY_SHORT[DAY_KEYS[i]] : DAY_SHORT[DAY_KEYS[i]] + '-' + DAY_SHORT[DAY_KEYS[j]];
    var v = days[DAY_KEYS[i]];
    parts.push(span + ' ' + (v.closed ? 'Closed' : to12h(v.open) + '-' + to12h(v.close)));
    i = j + 1;
  }
  return parts.join(', ');
}
function officeHoursText(f){
  var s = parseHours(f.officeHoursStruct);
  if (s && hoursComplete(s)) return formatHours(s);
  return isBlank(f.officeHours) ? '' : String(f.officeHours).trim();
}

// ---------- field helpers ----------
function isBlank(v){
  if (v === undefined || v === null) return true;
  var s = String(v).trim();
  return s === '' || s === '-';
}
function effective(fields, f){
  if (f.key === 'officeHours') return officeHoursText(fields);
  if (f.autoIf && String(fields[f.autoIf.field] || '').trim() === f.autoIf.equals) return f.autoIf.value;

  // A choice answered "Other" reads as whatever was typed instead.
  if (f.allowOther && String(fields[f.key] || '').trim() === f.allowOther) {
    var typed = fields[f.otherKey];
    return isBlank(typed) ? '' : String(typed).trim();
  }

  // A confirm line reads as whichever value ends up being true.
  if (f.type === 'confirm') {
    var ok = String(fields[f.answerKey] || '').trim();
    if (ok === 'Yes') return isBlank(fields[f.key]) ? '' : String(fields[f.key]).trim();
    if (ok === 'No') {
      var fixed = fields[f.correctionKey];
      return isBlank(fixed) ? '' : String(fixed).trim();
    }
    return '';
  }

  var v = fields[f.key];
  return isBlank(v) ? '' : String(v).trim();
}

// What we hold on file for a confirm line, before anyone answers it.
function onFile(fields, f){
  var v = fields[f.key];
  return isBlank(v) ? '' : String(v).trim();
}

function openedKeyOf(f){ return f.openedKey || (f.key + 'Opened'); }
function wasOpened(fields, f){ return String(fields[openedKeyOf(f)] || '').trim() === 'Yes'; }
// hiddenIf takes one condition or a list; any match makes the field not apply.
function isHidden(fields, f){
  if (!f.hiddenIf) return false;
  var conds = Array.isArray(f.hiddenIf) ? f.hiddenIf : [f.hiddenIf];
  return conds.some(function(c){ return String(fields[c.field] || '').trim() === c.equals; });
}
function isRequired(fields, f){
  if (isHidden(fields, f)) return false;
  if (f.required) return true;
  if (f.requiredIf) return String(fields[f.requiredIf.field] || '').trim() === f.requiredIf.equals;
  return false;
}
function isAuto(fields, f){
  return !!(f.autoIf && String(fields[f.autoIf.field] || '').trim() === f.autoIf.equals);
}
// Lines the reviewer actually has to work through: anything that must be answered,
// plus anything that already carries a value worth verifying. An optional field
// that is blank has nothing to check, so it is left out of the count.
function checkableFields(live){
  return FIELDS.filter(function(f){
    if (f.locked || f.system || f.staff) return false;
    if (isHidden(live, f) || isAuto(live, f)) return false;
    return isRequired(live, f) || !isBlank(effective(live, f));
  });
}
function missingOf(fields){
  return FIELDS.filter(function(f){
    if (f.locked || f.system || f.staff) return false;
    if (!isRequired(fields, f)) return false;
    // A link that must be opened is not answered until it has been -- but only
    // when there is a link. Nothing on file means nothing to open.
    if (f.type === 'confirm' && f.requireOpen && !isBlank(fields[f.key]) && !wasOpened(fields, f)) return true;
    return isBlank(effective(fields, f));
  }).map(function(f){ return f.key; });
}

// ---------- per-line state ----------
function rowState(p, f){
  var m = rows[p.id] || (rows[p.id] = {});
  if (m[f.key]) return m[f.key];
  // Blank on file means there is nothing to verify -- go straight to entry.
  return isBlank(effective(p.fields || {}, f)) ? 'editing' : 'idle';
}
function setRowState(p, f, v){ (rows[p.id] || (rows[p.id] = {}))[f.key] = v; }

function rowSettled(p, live, f){
  var st = rowState(p, f);
  if (st === 'confirmed') return true;
  if (st === 'editing') return !isBlank(effective(live, f)) || !isRequired(live, f);
  return false;
}
function checkProgress(p, live){
  var list = checkableFields(live);
  var done = list.filter(function(f){ return rowSettled(p, live, f); }).length;
  return { done: done, total: list.length, all: done === list.length && list.length > 0 };
}

// ---------- who is completing this ----------
// Each property records its own "Completed by". Deliberately NOT carried over
// from the previous property: typing your name against each one is a small,
// intentional friction, the same reason every line is confirmed individually.
function completedByOf(p, live){
  if (!live.__cbSeeded) {
    live.__cbSeeded = true;
    if (!String(live.completedBy || '').trim()) {
      live.completedBy = (p.fields && p.fields.completedBy) || '';
    }
  }
  return String(live.completedBy || '').trim();
}

// ---------- boot ----------
function boot(){
  var params = new URLSearchParams(location.search);
  state.waveId = params.get('wave') || null;
  state.scope = state.waveId ? 'wave' : 'open';

  var wavesUrl = state.waveId
    ? '/api/waves?wave=' + encodeURIComponent(state.waveId)
    : '/api/waves?scope=open';

  Promise.all([ api('/api/schema'), api(wavesUrl) ]).then(function(r){
    FIELDS = r[0].fields;
    FIELDS.forEach(function(f){ BY_KEY[f.key] = f; });

    var d = r[1];
    state.waves = state.waveId ? [d.wave] : (d.waves || []);

    if (!state.waves.length) {
      $('#waveSub').textContent = 'Nothing open right now';
      $('#pickPanel').innerHTML = '<h2>Nothing to review yet</h2>' +
        '<p class="hint">There are no open waves. If you were expecting one, check with Carlie.</p>';
      return;
    }

    if (state.waveId) {
      var w = d.wave;
      $('#waveSub').textContent = w.name + dateSuffix(w);
      $('#pickHint').textContent = 'Choose your Regional Manager to see the ' + w.name + ' properties that need checking.';
    } else {
      $('#waveSub').textContent = state.waves.length === 1
        ? state.waves[0].name + dateSuffix(state.waves[0])
        : state.waves.length + ' open waves';
    }

    var sel = $('#rmSel');
    sel.innerHTML = '';
    sel.appendChild(el('option', { value:'', text:'Select a name…' }));
    (d.regionals || []).forEach(function(rg){
      var tag = rg.complete ? ' ✓ complete' : ' — ' + (rg.verified || 0) + '/' + (rg.total || 0) + ' done';
      sel.appendChild(el('option', { value:rg.rmSlug, text: rg.rmName + tag }));
    });
    sel.onchange = function(){ if (sel.value) openPortfolio(sel.value); };

    var rm = params.get('rm');
    if (rm) { sel.value = rm; openPortfolio(rm); }
  }).catch(fatal);
}

function dateSuffix(w){
  var bits = [];
  if (w.dueDate) bits.push('due ' + fmtDate(w.dueDate));
  if (w.transitionDate) bits.push('CRMiQ ' + fmtDate(w.transitionDate));
  return bits.length ? ' • ' + bits.join(' • ') : '';
}

function fatal(e){
  var box = $('#fatal');
  box.classList.remove('hidden');
  box.textContent = 'Something went wrong: ' + (e && e.message ? e.message : e);
}

function setUrl(url){ try { history.replaceState(null, '', url); } catch(e){} }

// Opening a portfolio adds a history entry, so the phone's own back button
// returns to the name list instead of leaving the site.
var pushedPortfolio = false;
function pushUrl(url){
  try { history.pushState(null, '', url); pushedPortfolio = true; }
  catch(e){ setUrl(url); }
}

function currentQuery(rmSlug){
  var q = [];
  if (state.waveId) q.push('wave=' + encodeURIComponent(state.waveId));
  if (rmSlug) q.push('rm=' + encodeURIComponent(rmSlug));
  return q.length ? '?' + q.join('&') : '';
}

function showPicker(){
  state.rmSlug = null;
  $('#portfolio').classList.add('hidden');
  $('#pickPanel').classList.remove('hidden');
  // Clear the selection, or picking the same wrong name again would do nothing.
  var sel = $('#rmSel');
  if (sel) sel.value = '';
  setUrl(location.pathname + currentQuery(null));
  window.scrollTo({ top:0, behavior:'smooth' });
}

// Unwind the pushed entry where there is one, so in-app back and the phone's
// back button leave the same history behind.
function goBack(){
  if (pushedPortfolio) history.back();
  else showPicker();
}

window.addEventListener('popstate', function(){
  var params = new URLSearchParams(location.search);
  var rm = params.get('rm');
  if (rm) { openPortfolio(rm, { fromHistory: true }); }
  else { pushedPortfolio = false; showPicker(); }
});

function openPortfolio(rmSlug, opts){
  opts = opts || {};
  state.rmSlug = rmSlug;
  drafts = {}; rows = {};
  var url = '/api/portfolio?rm=' + encodeURIComponent(rmSlug) +
            (state.waveId ? '&wave=' + encodeURIComponent(state.waveId) : '');
  return api(url).then(function(d){
    state.regional = d.regional;
    state.props = d.properties || [];
    state.waves = d.waves || state.waves;
    $('#pickPanel').classList.add('hidden');
    $('#portfolio').classList.remove('hidden');
    // Restoring from a back/forward press must not stack another entry.
    (opts.fromHistory ? setUrl : pushUrl)(location.pathname + currentQuery(rmSlug));
    $('#shareUrl').value = location.origin + location.pathname + currentQuery(rmSlug);
    render();
    window.scrollTo({ top:0, behavior:'smooth' });
  }).catch(fatal);
}

// ---------- rendering ----------
function render(){
  var total = state.props.length;
  var done = state.props.filter(function(p){ return p.status === 'verified'; }).length;

  $('#rmTitle').textContent = state.regional.rmName;
  $('#rmSubtitle').textContent = total + (total === 1 ? ' property' : ' properties') +
    (state.waveId ? ' in ' + (state.waves[0] ? state.waves[0].name : '') : ' to check');
  $('#progBar').style.width = (total ? Math.round(done / total * 100) : 0) + '%';
  $('#progLabel').textContent = done + ' of ' + total + ' confirmed';

  var banner = $('#doneBanner');
  if (total && done === total) {
    banner.classList.remove('hidden');
    banner.textContent = 'All done — everything is confirmed and Carlie has been notified. Thank you.';
  } else banner.classList.add('hidden');

  var list = $('#propList');
  list.innerHTML = '';
  if (!total) {
    list.appendChild(el('div', { class:'center', text:'Nothing is assigned to this Regional right now.' }));
    return;
  }

  // One section per wave, newest first, so the latest import always sits on top
  // and finished waves stay visible below it.
  state.waves.forEach(function(w){
    var props = state.props.filter(function(p){ return p.waveId === w.id; });
    if (!props.length) return;

    var vDone = props.filter(function(p){ return p.status === 'verified'; }).length;
    var head = el('div', { class:'wavehead' }, [ el('h3', { text: w.name || '' }) ]);

    var status = el('span', { class:'pill ' + (vDone === props.length ? 'verified' : 'needs_input'),
      text: vDone === props.length ? 'Complete' : (vDone + ' of ' + props.length + ' done') });
    head.appendChild(status);

    var dates = el('div', { class:'dates' });
    if (w.dueDate) {
      dates.appendChild(document.createTextNode('Verify by '));
      dates.appendChild(el('b', { text: fmtDate(w.dueDate) }));
    }
    if (w.transitionDate) {
      if (w.dueDate) dates.appendChild(document.createTextNode('  •  '));
      dates.appendChild(document.createTextNode('Moves to CRMiQ '));
      dates.appendChild(el('b', { text: fmtDate(w.transitionDate) }));
    }
    if (dates.childNodes.length) head.appendChild(dates);

    list.appendChild(head);
    props.forEach(function(p){ list.appendChild(propCard(p)); });
  });
}

var STATUS_LABEL = { verified:'Confirmed', ready:'Ready to confirm', in_progress:'In progress', needs_input:'Needs info' };

function propCard(p){
  var open = !!p._open;
  // Status drives a colour band down the left of the card, so the list reads at
  // a glance without opening anything.
  var card = el('div', { class:'prop st-' + p.status + (open ? ' open' : '') +
                                (p.status === 'verified' ? ' done' : ''),
                         'data-pid': p.waveId + '|' + p.id });

  var sub = 'Code ' + (p.fields.propertyCode || '—');
  if (p.status !== 'verified') {
    var live = drafts[p.id] || p.fields;
    var pr = checkProgress(p, live);
    sub += ' • ' + pr.done + ' of ' + pr.total + ' lines checked';
  }

  card.appendChild(el('button', { class:'prop-head', type:'button', onclick: function(){
    p._open = !p._open; render();
  }}, [
    el('span', { class:'chev', html:'<svg width="12" height="12" viewBox="0 0 12 12"><path d="M4 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>' }),
    el('span', { class:'prop-title' }, [
      el('strong', { text: p.fields.propertyName || '(unnamed)' }),
      el('span', { text: sub })
    ]),
    el('span', { class:'pill ' + p.status, text: STATUS_LABEL[p.status] || p.status })
  ]));

  var body = el('div', { class:'prop-body' });
  if (open) buildBody(body, p);
  card.appendChild(body);
  return card;
}

// Which staff name is currently acting as the property's owner. That one cannot
// be edited here, because changing it would move the property to someone else.
function ownerKeyOf(fields){
  var chain = FIELDS.filter(function(f){ return f.ownerRank; })
                    .sort(function(a,b){ return a.ownerRank - b.ownerRank; });
  for (var i = 0; i < chain.length; i++) {
    if (!isBlank(fields[chain[i].key])) return chain[i].key;
  }
  return null;
}

// Property details and the people attached to it. Not questions to verify --
// reference, with an Edit button for the names.
function referenceBlock(p, fields, editable){
  var wrap = el('div');
  var dl = el('div', { class:'facts' });

  FIELDS.filter(function(f){ return f.locked; }).forEach(function(f){
    // rmName is the resolved owner and is listed again among the staff names
    // below, so showing it here would repeat the same person twice.
    if (f.key === 'rmName') return;
    var v = fields[f.key];
    if (isBlank(v)) return;
    dl.appendChild(el('div', { class:'fact' }, [
      el('dt', { text: f.label }),
      el('dd', { text: f.type === 'date' ? fmtDate(v) : String(v) })
    ]));
  });

  var owner = ownerKeyOf(fields);
  var staff = FIELDS.filter(function(f){ return f.staff; });
  var editing = p && staffEdit[p.id];

  // Every position is listed even when empty. A blank slot is the only thing
  // that prompts anyone to fill it in, so hiding them hid the gap as well.
  staff.forEach(function(f){
    var v = fields[f.key];
    var dd = el('dd');
    if (editing && f.key !== owner) {
      var inp = el('input', { type:'text', class:'staffin', placeholder:'—' });
      inp.value = isBlank(v) ? '' : String(v);
      inp.addEventListener('input', function(){ fields[f.key] = inp.value; });
      dd.appendChild(inp);
    } else {
      dd.appendChild(isBlank(v)
        ? el('span', { class:'blankstaff', text:'Not on file' })
        : el('span', { text: String(v) }));
      if (editing && f.key === owner) {
        dd.appendChild(el('span', { class:'lockmark',
          text:' — this is the portfolio this property sits in, so it cannot be changed here' }));
      }
    }
    dl.appendChild(el('div', { class:'fact' }, [ el('dt', { text: f.label }), dd ]));
  });

  wrap.appendChild(dl);

  if (editable && p) {
    var bar = el('div', { class:'refactions' });
    if (!editing) {
      bar.appendChild(el('button', { class:'btn ghost tiny', type:'button', text:'Edit these details',
        onclick: function(){ staffEdit[p.id] = true; render(); } }));
    } else {
      bar.appendChild(el('button', { class:'btn ok tiny', type:'button', text:'Save details',
        onclick: function(ev){ staffEdit[p.id] = false; submit(p, ev.currentTarget, false); } }));
      bar.appendChild(el('button', { class:'btn ghost tiny', type:'button', text:'Cancel',
        onclick: function(){ staffEdit[p.id] = false; delete drafts[p.id]; render(); } }));
    }
    wrap.appendChild(bar);
  }
  return wrap;
}

function buildBody(body, p){
  if (p.status === 'verified') {
    body.appendChild(el('div', { class:'banner good',
      text: 'Confirmed by ' + (p.verifiedBy || 'someone') + ' on ' +
            new Date(p.verifiedAt).toLocaleString('en-US', { dateStyle:'medium', timeStyle:'short' }) + '.' }));
    body.appendChild(referenceBlock(p, p.fields, false));
    var dl = el('div', { class:'facts' });
    FIELDS.forEach(function(f){
      if (f.locked || f.system || isHidden(p.fields, f)) return;
      var dd = el('dd');
      dd.appendChild(valueNode(f, effective(p.fields, f)));
      dl.appendChild(el('div', { class:'fact' }, [ el('dt', { text: f.label }), dd ]));
    });
    body.appendChild(dl);
    body.appendChild(el('div', { class:'banner lock', text:'This property is locked because it has been confirmed.' }));
    body.appendChild(el('div', { class:'actions' }, [
      el('button', { class:'btn ghost', type:'button', text:'I need to make a correction', onclick: function(){
        modal({ title:'Need to make a correction?',
          lines:['Reach out to Carlie Ahern on Teams to make a correction.'],
          buttons:[{ label:'Close', value:false, style:'ghost' }] });
      }})
    ]));
    return;
  }

  var live = drafts[p.id] || (drafts[p.id] = Object.assign({}, p.fields));
  var pr = checkProgress(p, live);

  body.appendChild(el('div', { class:'banner info',
    text: 'Check each line below one at a time. Confirm what is right, correct what is not, and fill in anything we do not have.' }));

  body.appendChild(referenceBlock(p, live, true));

  // Answering Yes to HappyCo removes two questions from the list. Say so, or it
  // looks like lines vanished and the count dropped for no reason.
  if (String(live.happyCo || '').trim() === 'Yes') {
    var na = FIELDS.filter(function(f){ return isHidden(live, f) && !f.locked && !f.system && !f.staff; })
                   .map(function(f){ return f.label; })
                   .filter(function(l, i, arr){ return arr.indexOf(l) === i; });
    var auto = FIELDS.filter(function(f){
      return f.autoIf && !isHidden(live, f) &&
             String(live[f.autoIf.field] || '').trim() === f.autoIf.equals;
    });

    if (na.length || auto.length) {
      var note = el('div', { class:'na-note' });
      note.appendChild(el('div', { style:'font-weight:600;color:var(--ink);margin-bottom:5px',
        text:'This property uses HappyCo, so some lines are handled for you.' }));
      if (auto.length) {
        note.appendChild(el('div', { text: 'Set automatically: ' +
          auto.map(function(f){ return f.label + ' = ' + f.autoIf.value; }).join('; ') + '.' }));
      }
      if (na.length) {
        note.appendChild(el('div', { style: auto.length ? 'margin-top:3px' : '',
          text: 'Does not apply: ' + na.join('; ') + '.' }));
      }
      body.appendChild(note);
    }
  }

  checkableFields(live).forEach(function(f){ body.appendChild(vrow(p, live, f)); });

  // Completed by — attribution, not a line to verify, so it sits on its own.
  var who = completedByOf(p, live);
  var whoRow = el('div', { class:'vrow completedby' + (who ? ' settled' : ' blank') });
  var whoLab = el('div', { class:'vlabel' }, [ el('span', { text:'Completed by' }) ]);
  if (who) whoLab.appendChild(el('span', { class:'tick', text:'✓' }));
  whoRow.appendChild(whoLab);
  whoRow.appendChild(el('div', { class:'note', style:'margin-top:0;margin-bottom:8px',
    text:'Type your full name to sign off on this property. Signed separately for each one.' }));
  var whoInput = el('input', { type:'text', id:'cb_' + p.id, placeholder:'Type your full name to sign' });
  whoInput.value = live.completedBy || '';
  whoInput.addEventListener('input', function(){ live.completedBy = whoInput.value; });
  whoInput.addEventListener('blur', function(){ render(); });
  whoRow.appendChild(whoInput);

  // Stamped, not typed: always today, shown so the reviewer can see what is
  // being recorded against their name.
  var dateWrap = el('div', { class:'signdate' });
  dateWrap.appendChild(el('label', { class:'fl', text:'Date' }));
  var dateIn = el('input', { type:'text', readonly:'readonly', tabindex:'-1' });
  dateIn.value = fmtDate(todayISO());
  dateWrap.appendChild(dateIn);
  dateWrap.appendChild(el('div', { class:'note', text:'Recorded automatically.' }));
  whoRow.appendChild(dateWrap);

  body.appendChild(whoRow);

  body.appendChild(el('div', { class:'checkline',
    text: pr.done + ' of ' + pr.total + ' lines checked' +
          (pr.all && who ? ' — ready to confirm' : '') }));

  var actions = el('div', { class:'actions' });
  var confirmBtn = el('button', { class:'btn ok', type:'button', text:'Save & confirm property',
    onclick: function(ev){ askThenSubmit(p, ev.currentTarget); }});
  if (!pr.all || !who) confirmBtn.disabled = true;
  actions.appendChild(confirmBtn);
  actions.appendChild(el('button', { class:'btn ghost', type:'button', text:'Save for later',
    onclick: function(ev){ submit(p, ev.currentTarget, false); }}));
  body.appendChild(actions);

  if (!pr.all || !who) {
    body.appendChild(el('div', { class:'note',
      text: !pr.all
        ? 'Every line needs to be checked before this property can be confirmed.'
        : 'Enter your name above to confirm this property.' }));
  }
  if (p.updatedAt) {
    body.appendChild(el('div', { class:'meta',
      text:'Last saved ' + new Date(p.updatedAt).toLocaleString('en-US', { dateStyle:'medium', timeStyle:'short' }) }));
  }
}

// One verifiable line.
// Office hours are stored and exported as one line, but a run-together sentence
// is hard to check a day at a time, so they are shown stacked.
function hoursRows(text){
  return String(text || '').split(/\s*,\s*/).map(function(s){ return s.trim(); }).filter(Boolean)
    .map(function(seg){
      var m = seg.match(/^(\S+)\s+(.*)$/);
      return m ? { day: m[1], time: m[2] } : { day: seg, time: '' };
    });
}

// One place that decides how a confirmed value is displayed.
function valueNode(f, value){
  if (!value) return el('div', { class:'vvalue', text:'—' });

  if (f.key === 'officeHours') {
    var rows = hoursRows(value);
    if (rows.length) {
      var box = el('div', { class:'hourslist' });
      rows.forEach(function(r){
        box.appendChild(el('div', { class:'hline' }, [
          el('span', { class:'hd', text: r.day }),
          el('span', { class:'ht', text: r.time || '' })
        ]));
      });
      return box;
    }
  }
  return el('div', { class:'vvalue', text: value });
}

function vrow(p, live, f){
  var st = rowState(p, f);
  var settled = rowSettled(p, live, f);
  var value = effective(live, f);
  var wasBlank = isBlank(effective(p.fields || {}, f));

  var row = el('div', { class:'vrow ' + (settled ? 'settled' : (st === 'editing' && wasBlank ? 'blank' : 'todo')) });

  var name = el('span', { text: f.label });
  // Nothing on file for this one: marked with an asterisk beside the question
  // rather than a sentence where the answer belongs.
  if (wasBlank) name.appendChild(el('span', { class:'req', title:'Nothing on file — please answer', text:' *' }));

  var lab = el('div', { class:'vlabel' }, [ name ]);
  if (settled) {
    lab.appendChild(el('span', { class:'tick',
      text: st === 'confirmed' ? '✓ Confirmed correct' : (wasBlank ? '✓ Added' : '✓ Updated') }));
  }
  row.appendChild(lab);

  if (f.hint) row.appendChild(el('div', { class:'vhint', text: f.hint }));

  // Shown in every state, including after the line is ticked, so the instruction
  // cannot be dismissed by confirming the line without following it.
  if (f.notice) row.appendChild(el('div', { class:'vnotice', text: f.notice }));

  if (st === 'idle' || st === 'confirmed') {
    row.appendChild(valueNode(f, value));
    var acts = el('div', { class:'vactions' });
    if (st === 'idle') {
      acts.appendChild(el('button', { class:'btn ok tiny', type:'button', text:'Correct', onclick: function(){
        setRowState(p, f, 'confirmed'); render();
      }}));
      acts.appendChild(el('button', { class:'btn ghost tiny', type:'button', text:'Needs fixing', onclick: function(){
        setRowState(p, f, 'editing'); render();
      }}));
    } else {
      acts.appendChild(el('button', { class:'linkbtn', type:'button', text:'Undo', onclick: function(){
        setRowState(p, f, 'idle'); render();
      }}));
      acts.appendChild(el('button', { class:'linkbtn', type:'button', text:'Change this', onclick: function(){
        setRowState(p, f, 'editing'); render();
      }}));
    }
    row.appendChild(acts);
    return row;
  }

  // editing
  row.appendChild(control(p, live, f));
  if (!wasBlank) {
    row.appendChild(el('div', { class:'vactions' }, [
      el('button', { class:'linkbtn', type:'button', text:'Actually, it was right', onclick: function(){
        live[f.key] = (p.fields || {})[f.key];
        if (f.key === 'officeHours') live.officeHoursStruct = (p.fields || {}).officeHoursStruct;
        setRowState(p, f, 'confirmed'); render();
      }})
    ]));
  }
  return row;
}

function control(p, live, f){
  if (f.type === 'hours') return hoursControl(p, live);

  // "Here is what we hold — is it right?" Optionally the value has to be opened
  // before it can be answered.
  if (f.type === 'confirm') {
    var box = el('div');
    var held = onFile(live, f);
    var opened = wasOpened(live, f);
    var answer = String(live[f.answerKey] || '').trim();

    if (held) {
      if (f.requireOpen) {
        var link = el('a', { class:'openlink', href: withScheme(held), target:'_blank', rel:'noopener noreferrer',
          text: held });
        link.addEventListener('click', function(){
          live[openedKeyOf(f)] = 'Yes';
          setTimeout(render, 60);   // let the tab open before the list redraws
        });
        box.appendChild(link);
        if (!opened) {
          box.appendChild(el('div', { class:'note', text: f.openHint || 'Open the link before answering.' }));
          return box;                                  // nothing else until it is opened
        }
        box.appendChild(el('div', { class:'note ok', text:'✓ Opened' }));
      } else {
        box.appendChild(el('div', { class:'vvalue', style:'margin-bottom:8px', text: held }));
      }
    } else {
      box.appendChild(el('div', { class:'note', text:'Nothing on file — enter the correct one below.' }));
    }

    if (held) {
      box.appendChild(el('div', { class:'confirmq', text: f.confirmPrompt || 'Is this correct?' }));
      var seg2 = el('div', { class:'seg' });
      ['Yes','No'].forEach(function(opt){
        var b = el('button', { type:'button', text:opt, onclick: function(){
          live[f.answerKey] = opt;
          if (opt === 'Yes') live[f.correctionKey] = '';
          render();
        }});
        b.setAttribute('aria-pressed', answer === opt ? 'true' : 'false');
        seg2.appendChild(b);
      });
      box.appendChild(seg2);
    }

    if (!held || answer === 'No') {
      var fix = el('input', { type:'text', style:'margin-top:10px',
        placeholder: f.correctionLabel || 'Enter the correct value' });
      fix.value = live[f.correctionKey] || '';
      fix.addEventListener('input', function(){
        live[f.correctionKey] = fix.value;
        if (!held) live[f.answerKey] = 'No';
      });
      fix.addEventListener('blur', function(){ render(); });
      box.appendChild(el('label', { class:'fl', style:'margin-top:10px',
        text: f.correctionLabel || 'Enter the correct value' }));
      box.appendChild(fix);
    }
    return box;
  }

  if (f.type === 'yesno' || f.type === 'choice') {
    var opts = f.options || ['Yes','No'];
    var wrapC = el('div');
    // A long option list reads better stacked than crammed into one strip.
    var seg = el('div', { class: opts.length > 3 ? 'optlist' : 'seg' });

    opts.forEach(function(opt){
      var b = el('button', { type:'button', onclick: function(){
        live[f.key] = opt;
        if (f.allowOther && opt !== f.allowOther) live[f.otherKey] = '';
        render();
      }});
      b.appendChild(el('span', { text: opt }));
      var note = f.optionNotes && f.optionNotes[opt];
      if (note) b.appendChild(el('span', { class:'optnote', text: note }));
      b.setAttribute('aria-pressed', String(live[f.key]).trim() === opt ? 'true' : 'false');
      seg.appendChild(b);
    });
    wrapC.appendChild(seg);

    // "Other" opens a box to name it.
    if (f.allowOther && String(live[f.key] || '').trim() === f.allowOther) {
      var oi = el('input', { type:'text', style:'margin-top:10px',
        placeholder:'Who is the provider?' });
      oi.value = live[f.otherKey] || '';
      oi.addEventListener('input', function(){ live[f.otherKey] = oi.value; });
      oi.addEventListener('blur', function(){ render(); });
      wrapC.appendChild(oi);
    }
    return wrapC;
  }
  if (f.type === 'textarea') {
    var toggleWrap = el('div');

    // An on/off switch whose "on" state is simply the field holding a fixed
    // value, so nothing extra has to be stored, saved or exported.
    if (f.toggle) {
      var on = String(live[f.key] || '').trim() === f.toggle.value;
      var tg = el('button', { class:'toggle' + (on ? ' on' : ''), type:'button',
        'aria-pressed': on ? 'true' : 'false',
        onclick: function(){
          if (String(live[f.key] || '').trim() === f.toggle.value) {
            live[f.key] = live['__prev_' + f.key] || '';   // restore what was typed before
          } else {
            var cur = String(live[f.key] || '').trim();
            if (cur && cur !== f.toggle.value) live['__prev_' + f.key] = cur;
            live[f.key] = f.toggle.value;
          }
          render();
        }});
      tg.appendChild(el('span', { class:'box', 'aria-hidden':'true', text: on ? '✓' : '' }));
      tg.appendChild(el('span', { text: f.toggle.label }));
      toggleWrap.appendChild(tg);

      if (on) {
        if (f.toggle.hint) toggleWrap.appendChild(el('div', { class:'note', text: f.toggle.hint }));
        return toggleWrap;   // no free-text box while the switch is on
      }
    }

    var ta = el('textarea', { id:'f_' + p.id + '_' + f.key, placeholder: f.placeholder || '' });
    ta.value = live[f.key] || '';
    ta.addEventListener('input', function(){ live[f.key] = ta.value; });
    ta.addEventListener('blur', function(){ render(); });
    if (f.toggle) { ta.style.marginTop = '9px'; toggleWrap.appendChild(ta); return toggleWrap; }
    return ta;
  }
  var inp = el('input', { type: f.type === 'tel' ? 'tel' : 'text',
    id:'f_' + p.id + '_' + f.key, placeholder: f.placeholder || '' });
  inp.value = live[f.key] || '';
  inp.addEventListener('input', function(){ live[f.key] = inp.value; });
  inp.addEventListener('blur', function(){
    // A number we already know is a tracking line is rejected on the spot, so
    // they re-check the handset rather than finding out at confirm time.
    if (f.checkTracking && trackingHit(live, inp.value)) {
      var bad = inp.value;
      live[f.key] = '';
      inp.value = '';
      render();
      modal({
        title: 'That is a tracking number',
        lines: [ bad + ' is a Knock tracking number and cannot be used.',
                 'Please reverify the direct landline number for the property per the instructions on that line.' ],
        buttons: [{ label:'OK', value:true, style:'ok' }]
      });
      return;
    }
    render();
  });
  return inp;
}

// Half-hour slots, 12:00 AM through 11:30 PM.
var TIME_SLOTS = (function(){
  var out = [];
  for (var m = 0; m < 24 * 60; m += 30) {
    var h = Math.floor(m / 60), mm = m % 60;
    var h12 = h % 12; if (h12 === 0) h12 = 12;
    out.push({
      value: String(h).padStart(2, '0') + ':' + String(mm).padStart(2, '0'),
      label: h12 + ':' + String(mm).padStart(2, '0') + ' ' + (h < 12 ? 'AM' : 'PM')
    });
  }
  return out;
})();

function slotLabel(hhmm){
  var m = String(hhmm || '').match(/^(\d{2}):(\d{2})$/);
  if (!m) return hhmm || '';
  var h = parseInt(m[1], 10), h12 = h % 12; if (h12 === 0) h12 = 12;
  return h12 + ':' + m[2] + ' ' + (h < 12 ? 'AM' : 'PM');
}

// A dropdown rather than a free time field, so every value is a real half-hour.
// A time already on file that is not on the half hour keeps its own option, so
// importing 8:45 cannot be silently rounded by opening the picker.
function timeSelect(current, ariaLabel, onPick){
  var sel = el('select', { class:'timesel', 'aria-label': ariaLabel });
  sel.appendChild(el('option', { value:'', text:'--' }));
  var known = false;
  TIME_SLOTS.forEach(function(s){
    if (s.value === current) known = true;
    sel.appendChild(el('option', { value:s.value, text:s.label }));
  });
  if (current && !known) {
    sel.appendChild(el('option', { value:current, text: slotLabel(current),
      title:'Already on file, not on the half hour' }));
  }
  sel.value = current || '';
  sel.addEventListener('change', function(){ onPick(sel.value); });
  return sel;
}

function hoursControl(p, live){
  var struct = parseHours(live.officeHoursStruct) ||
               { mode:'grouped', weekdays:blankDay(), saturday:blankDay(), sunday:blankDay() };

  function commit(){ live.officeHoursStruct = JSON.stringify(struct); render(); }

  var appt = !!struct.appointmentOnly;
  var box = el('div', { class:'hours' + (appt ? ' appt' : '') });

  var seg = el('div', { class:'seg sm', style:'margin-bottom:12px' });
  [['grouped','Same hours Mon–Fri'], ['daily','Set each day']].forEach(function(m){
    var b = el('button', { type:'button', text:m[1], onclick: function(){
      if ((struct.mode || 'grouped') === m[0]) return;
      var days = expandHours(struct);
      struct = m[0] === 'daily'
        ? { mode:'daily', days: days }
        : { mode:'grouped', weekdays: days.mon, saturday: days.sat, sunday: days.sun };
      commit();
    }});
    b.setAttribute('aria-pressed', (struct.mode || 'grouped') === m[0] ? 'true' : 'false');
    seg.appendChild(b);
  });
  box.appendChild(seg);

  function dayRow(label, get, set){
    var v = get();
    var row = el('div', { class:'hrow' + (v.closed ? ' closed' : '') });
    row.appendChild(el('div', { class:'hday', text: label }));

    var oc = el('div', { class:'seg sm' });
    [['open','Open'], ['closed','Closed']].forEach(function(o){
      var b = el('button', { type:'button', text:o[1], onclick: function(){
        var c = get(); set({ closed: o[0] === 'closed', open:c.open, close:c.close }); commit();
      }});
      b.setAttribute('aria-pressed', (v.closed ? 'closed' : 'open') === o[0] ? 'true' : 'false');
      oc.appendChild(b);
    });
    row.appendChild(oc);

    var times = el('div', { class:'times' });
    var oi = timeSelect(v.open, label + ' opens', function(val){
      var c = get(); set({ closed:c.closed, open:val, close:c.close }); commit();
    });
    oi.disabled = !!v.closed;
    var ci = timeSelect(v.close, label + ' closes', function(val){
      var c = get(); set({ closed:c.closed, open:c.open, close:val }); commit();
    });
    ci.disabled = !!v.closed;
    times.appendChild(oi);
    times.appendChild(el('span', { class:'dash', text:'to' }));
    times.appendChild(ci);
    row.appendChild(times);
    return row;
  }

  if ((struct.mode || 'grouped') === 'grouped') {
    box.appendChild(dayRow('Monday – Friday',
      function(){ return Object.assign(blankDay(), struct.weekdays || {}); }, function(v){ struct.weekdays = v; }));
    box.appendChild(dayRow('Saturday',
      function(){ return Object.assign(blankDay(), struct.saturday || {}); }, function(v){ struct.saturday = v; }));
    box.appendChild(dayRow('Sunday',
      function(){ return Object.assign(blankDay(), struct.sunday || {}); }, function(v){ struct.sunday = v; }));
  } else {
    if (!struct.days) struct.days = {};
    DAY_KEYS.forEach(function(d){
      box.appendChild(dayRow(DAY_LABEL[d],
        function(){ return Object.assign(blankDay(), struct.days[d] || {}); }, function(v){ struct.days[d] = v; }));
    });
  }

  // An office seen by appointment has no hours to state, so ticking this greys
  // the day rows out and completes the line on its own.
  var apptBtn = el('button', { class:'toggle' + (appt ? ' on' : ''), type:'button',
    'aria-pressed': appt ? 'true' : 'false', style:'margin-top:14px',
    onclick: function(){
      if (struct.appointmentOnly) delete struct.appointmentOnly;
      else struct.appointmentOnly = true;
      commit();
    }});
  apptBtn.appendChild(el('span', { class:'box', 'aria-hidden':'true', text: appt ? '✓' : '' }));
  apptBtn.appendChild(el('span', { text:'Appointment Only' }));
  box.appendChild(apptBtn);

  var prev = el('div', { class:'hours-preview' });
  if (appt) {
    prev.appendChild(document.createTextNode('Recorded as: '));
    prev.appendChild(el('b', { text:'By appointment only' }));
  } else if (hoursComplete(struct)) {
    prev.appendChild(document.createTextNode('Recorded as: '));
    prev.appendChild(el('b', { text: formatHours(struct) }));
  } else {
    prev.textContent = 'Set open and close times for each day you are open, and mark the rest Closed.';
  }
  box.appendChild(prev);
  return box;
}

// Links arrive from the sheet with or without a scheme; without one the browser
// would treat it as a relative path and go nowhere useful.
function todayISO(){
  var d = new Date();
  return d.getFullYear() + '-' +
         String(d.getMonth() + 1).padStart(2, '0') + '-' +
         String(d.getDate()).padStart(2, '0');
}

// ---- tracking numbers -----------------------------------------------------
function digitsOnly(v){ return String(v || '').replace(/\D/g, ''); }

function sameNumber(a, b){
  var x = digitsOnly(a), y = digitsOnly(b);
  if (!x || !y) return false;
  return x.slice(-10).length === 10 && x.slice(-10) === y.slice(-10);
}

function trackingHit(fields, value){
  if (isBlank(value)) return false;
  return String(fields.trackingNumbers || '')
    .split(/[,;\n]/)
    .map(function(s){ return digitsOnly(s); })
    .filter(function(s){ return s.length >= 7; })
    .some(function(t){ return sameNumber(t, value); });
}

// ---- "said No to HappyCo, then named HappyCo" -----------------------------
function squash(v){ return String(v || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }

function withinOneEdit(a, b){
  if (a === b) return true;
  if (Math.abs(a.length - b.length) > 1) return false;
  var i = 0, j = 0, edits = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { i++; j++; continue; }
    if (++edits > 1) return false;
    if (a.length > b.length) i++;
    else if (a.length < b.length) j++;
    else { i++; j++; }
  }
  if (i < a.length || j < b.length) edits++;
  return edits <= 1;
}

function looksLikeHappyCo(v){
  var s = squash(v);
  return !!s && withinOneEdit(s, 'happyco');
}

function namedAnsweringService(fields){
  var picked = String(fields.answeringService || '').trim();
  if (picked === 'Other') return String(fields.answeringServiceOther || '').trim();
  return picked;
}

function withScheme(u){
  var s = String(u || '').trim();
  if (!s) return s;
  return /^[a-z][a-z0-9+.-]*:\/\//i.test(s) ? s : 'https://' + s;
}

// ---------- saving ----------
function askThenSubmit(p, btn){
  var live = drafts[p.id] || p.fields;
  var pr = checkProgress(p, live);
  if (!pr.all) { toast('Please check every line first.'); render(); return; }
  var miss = missingOf(live);
  if (miss.length) { toast('Some required information is still blank.'); render(); return; }

  var who = String(live.completedBy || '').trim();
  if (!who) {
    toast('Please enter your name under "Completed by".');
    render();
    var box = document.getElementById('cb_' + p.id);
    if (box) box.focus();
    return;
  }

  // Last time, people answered No to HappyCo and then named HappyCo as their
  // answering service. Catch the contradiction before it is signed off.
  if (String(live.happyCo || '').trim() === 'No' && looksLikeHappyCo(namedAnsweringService(live))) {
    modal({
      title: 'Quick check on HappyCo',
      lines: [
        'You answered No to "Does the property use HappyCo?", but named ' +
          namedAnsweringService(live) + ' as the answering service.',
        'If the property uses HappyCo, we should record that as Yes — it also sets the ' +
          'answering service and forwarding for you.',
        'Which is right?'
      ],
      buttons: [
        { label:'It does use HappyCo — fix it', value:'fix', style:'ok' },
        { label:'No, that is correct as written', value:'keep', style:'ghost' }
      ]
    }).then(function(choice){
      if (choice === 'fix') {
        live.happyCo = 'Yes';
        live.answeringService = '';
        live.answeringServiceOther = '';
        setRowState(p, BY_KEY.happyCo, 'confirmed');
        render();
        toast('Set to Yes — please check the lines that changed.');
        return;
      }
      if (choice === 'keep') confirmNow(p, btn);
    });
    return;
  }

  confirmNow(p, btn);
}

function confirmNow(p, btn){
  modal({
    title: 'Are you sure?',
    lines: ['You will not be able to make a correction once confirmed.'],
    buttons: [
      { label:'Go back', value:false, style:'ghost' },
      { label:'Confirm', value:true, style:'ok' }
    ]
  }).then(function(yes){
    if (yes) submit(p, document.body.contains(btn) ? btn : null, true);
  });
}

function submit(p, btn, verify){
  var live = drafts[p.id] || p.fields;
  var original = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }

  api('/api/save', {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({
      waveId: p.waveId, propertyId: p.id,
      fields: live, verify: !!verify,
      personName: String(live.completedBy || '').trim()
    })
  }).then(function(d){
    var idx = state.props.findIndex(function(x){ return x.id === p.id && x.waveId === p.waveId; });
    var wasOpen = p._open;
    if (idx >= 0) {
      state.props[idx] = Object.assign(d.property, {
        // Confirming finishes the property, so fold it away and leave the list
        // showing what is still outstanding.
        _open: verify ? false : wasOpen, waveId: p.waveId, waveName: p.waveName
      });
      // keep the inherited transition date visible after a save
      if (!state.props[idx].fields.transitionDate && p.fields.transitionDate) {
        state.props[idx].fields.transitionDate = p.fields.transitionDate;
      }
    }
    if (verify) { delete drafts[p.id]; delete rows[p.id]; }
    else { drafts[p.id] = Object.assign({}, d.property.fields); }

    recountRegional();
    render();

    // Collapsing a tall card pulls everything below it upwards, which is
    // disorienting mid-list, so hold the collapsed card in view.
    if (verify) {
      var sel = '.prop[data-pid="' + (p.waveId + '|' + p.id).replace(/"/g, '\\"') + '"]';
      var card = document.querySelector(sel);
      if (card) {
        var top = card.getBoundingClientRect().top;
        if (top < 0 || top > window.innerHeight - 120) {
          card.scrollIntoView({ block:'center', behavior:'smooth' });
        }
      }
    }

    toast(verify ? 'Confirmed.' : 'Saved.');
    if (verify && state.regional.complete) toast('Portfolio complete — thank you!');
  }).catch(function(e){
    if (btn) { btn.disabled = false; btn.textContent = original; }
    if (e.body && e.body.locked) {
      modal({ title:'Already confirmed',
        lines:['Reach out to Carlie Ahern on Teams to make a correction.'],
        buttons:[{ label:'Close', value:false, style:'ghost' }] })
        .then(function(){ openPortfolio(state.rmSlug); });
      return;
    }
    toast(e.message || 'Could not save.');
  });
}

function recountRegional(){
  var total = state.props.length;
  var verified = state.props.filter(function(p){ return p.status === 'verified'; }).length;
  state.regional = Object.assign(state.regional || {}, {
    total: total, verified: verified, complete: total > 0 && verified === total
  });
}

// ---------- wiring ----------
$('#backBtn').addEventListener('click', function(){ goBack(); });
$('#copyBtn').addEventListener('click', function(){
  var f = $('#shareUrl');
  f.select();
  if (navigator.clipboard) navigator.clipboard.writeText(f.value).then(
    function(){ toast('Link copied'); },
    function(){ document.execCommand('copy'); toast('Link copied'); });
  else { document.execCommand('copy'); toast('Link copied'); }
});

boot();
})();
